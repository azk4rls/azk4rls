<svg width="800" height="30" viewBox="0 0 800 30" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff003c" stop-opacity="0"/>
      <stop offset="15%" stop-color="#ff003c" stop-opacity="1"/>
      <stop offset="50%" stop-color="#7a00ff" stop-opacity="1"/>
      <stop offset="85%" stop-color="#ff003c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff003c" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Central line with gradient -->
  <line x1="0" y1="15" x2="800" y2="15" stroke="url(#divGrad)" stroke-width="2" />
  
  <!-- Cyber diamond in the center -->
  <polygon points="400,7 408,15 400,23 392,15" fill="#ff003c" filter="url(#glow)" />
  <circle cx="400" cy="15" r="2" fill="#ffffff" />
  
  <!-- Secondary elements -->
  <rect x="360" y="13" width="15" height="4" fill="#7a00ff" />
  <rect x="425" y="13" width="15" height="4" fill="#7a00ff" />
  <circle cx="345" cy="15" r="3" fill="#ff003c" />
  <circle cx="455" cy="15" r="3" fill="#ff003c" />
</svg>
