<svg width="800" height="250" viewBox="0 0 800 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glow Filters -->
    <filter id="neon-glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neon-glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Linear Gradients -->
    <linearGradient id="diagonalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff003c" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#7a00ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ff003c" stop-opacity="0.15" />
    </linearGradient>
    
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff003c" />
      <stop offset="50%" stop-color="#7a00ff" />
      <stop offset="100%" stop-color="#ff003c" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ff003c" />
      <stop offset="100%" stop-color="#7a00ff" />
    </linearGradient>
    
    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7a00ff" stroke-width="1" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Style tag for animations -->
  <style>
    @keyframes scan {
      0% { transform: translateY(-10px); opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { transform: translateY(260px); opacity: 0.3; }
    }
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }
    @keyframes glitch {
      0% { transform: translate(0) }
      20% { transform: translate(-2px, 2px) }
      40% { transform: translate(-2px, -2px) }
      60% { transform: translate(2px, 2px) }
      80% { transform: translate(2px, -2px) }
      100% { transform: translate(0) }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .scanline {
      animation: scan 6s linear infinite;
    }
    .pulse-glow {
      animation: pulse 3s ease-in-out infinite;
    }
    .glitch-text {
      animation: glitch 1s steps(2, start) infinite;
      animation-play-state: running;
    }
    .glitch-text:hover {
      animation: glitch 0.2s steps(2, start) infinite;
    }
    .blink-element {
      animation: blink 1s infinite;
    }
    .tech-font {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
    }
  </style>

  <!-- Dark Background -->
  <rect width="800" height="250" fill="#07070d" />
  
  <!-- Cyber Grid -->
  <rect width="800" height="250" fill="url(#grid)" />
  
  <!-- Diagonal Technical Overlay -->
  <path d="M-100,0 L400,0 L200,250 L-100,250 Z" fill="url(#diagonalGrad)" />
  <path d="M900,250 L500,250 L600,0 L900,0 Z" fill="url(#diagonalGrad)" />

  <!-- Cyberpunk Glowing Frame -->
  <rect x="15" y="15" width="770" height="220" rx="6" fill="none" stroke="url(#borderGrad)" stroke-width="2" filter="url(#neon-glow-red)" />
  <rect x="20" y="20" width="760" height="210" rx="4" fill="none" stroke="#07070d" stroke-width="4" />
  
  <!-- Corner Tech Markings -->
  <!-- Top-Left -->
  <path d="M 10 30 L 10 10 L 30 10" stroke="#ff003c" stroke-width="3" fill="none"/>
  <!-- Top-Right -->
  <path d="M 790 30 L 790 10 L 770 10" stroke="#ff003c" stroke-width="3" fill="none"/>
  <!-- Bottom-Left -->
  <path d="M 10 220 L 10 240 L 30 240" stroke="#ff003c" stroke-width="3" fill="none"/>
  <!-- Bottom-Right -->
  <path d="M 790 220 L 790 240 L 770 240" stroke="#ff003c" stroke-width="3" fill="none"/>

  <!-- Scanning Line -->
  <line class="scanline" x1="15" y1="0" x2="785" y2="0" stroke="#ff003c" stroke-width="1.5" filter="url(#neon-glow-red)" />

  <!-- HUD Details -->
  <!-- Left Column Data -->
  <text x="40" y="50" fill="#7a00ff" class="tech-font" font-size="11" opacity="0.8">SYS.LOC: //PORT_8080</text>
  <text x="40" y="70" fill="#7a00ff" class="tech-font" font-size="11" opacity="0.8">NET_STATUS: INJECTED</text>
  <text x="40" y="90" fill="#ff003c" class="tech-font" font-size="11" opacity="0.8">SECURITY: BYPASSED</text>
  <circle cx="175" cy="86" r="3" fill="#ff003c" class="blink-element" />

  <!-- Right HUD Graphic -->
  <circle cx="730" cy="70" r="25" stroke="#7a00ff" stroke-width="1" stroke-dasharray="5 3" fill="none" class="pulse-glow" />
  <circle cx="730" cy="70" r="18" stroke="#ff003c" stroke-width="1.5" stroke-dasharray="20 10" fill="none">
    <animateTransform attributeName="transform" type="rotate" from="0 730 70" to="-360 730 70" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="730" cy="70" r="5" fill="#ff003c" />

  <!-- Center Content -->
  <g transform="translate(400, 125)">
    <!-- Main Glowing Title -->
    <text class="tech-font glitch-text" font-size="44" fill="#ffffff" text-anchor="middle" filter="url(#neon-glow-purple)" style="letter-spacing: 5px;">CYBER_PORTAL</text>
    <text class="tech-font glitch-text" font-size="44" fill="url(#textGrad)" text-anchor="middle" style="letter-spacing: 5px;">CYBER_PORTAL</text>
    
    <!-- Subtitle -->
    <text y="40" class="tech-font" font-size="14" fill="#ff003c" text-anchor="middle" style="letter-spacing: 4px;">// COGNITIVE INFRASTRUCTURE ACTIVE</text>
    
    <!-- Technical brackets -->
    <text x="-210" y="5" class="tech-font" font-size="28" fill="#7a00ff">[</text>
    <text x="210" y="5" class="tech-font" font-size="28" fill="#7a00ff">]</text>
  </g>

  <!-- Bottom Tech Bar -->
  <rect x="250" y="200" width="300" height="2" fill="url(#borderGrad)" />
  <rect class="blink-element" x="385" y="205" width="30" height="8" fill="#ff003c" />
  <text x="240" y="212" fill="#7a00ff" class="tech-font" font-size="10" text-anchor="end">SYS.VER // 4.04</text>
  <text x="560" y="212" fill="#7a00ff" class="tech-font" font-size="10" text-anchor="start">SYS.LN // UTF-8</text>
</svg>
